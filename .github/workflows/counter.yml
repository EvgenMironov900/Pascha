name: Counter Final

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read, increment, write and push
        run: |
          # Читаем число
          current=$(grep -oE '[0-9]+' stats.json)
          if [ -z "$current" ]; then
            current=0
          fi

          # Считаем
          next=$((current + 1))

          # Выводим в Job summary — видно сразу, без раскрытия логов
          echo "Current: $current" >> $GITHUB_STEP_SUMMARY
          echo "Next: $next" >> $GITHUB_STEP_SUMMARY

          # Пишем новый JSON
          echo "{\"views\":$next}" > stats.json

          # Коммитим и пушим только если файл реально изменился
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if git diff --quiet HEAD -- stats.json; then
            echo "No changes to stats.json, skipping commit."
          else
            git add stats.json
            git commit -m "Update views to $next"
            git push
          fi
