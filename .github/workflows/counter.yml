name: Counter Test (no push)

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Read and increment
        run: |
          current=$(grep -oE '[0-9]+' stats.json)
          if [ -z "$current" ]; then
            current=0
          fi
          next=$((current + 1))
          echo "Current: $current"
          echo "Next: $next"
          echo "{\"views\":$next}" > stats.json
          cat stats.json
