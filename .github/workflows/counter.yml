name: Counter Final

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read, increment and write
        id: count
        run: |
          current=$(grep -oE '[0-9]+' stats.json)
          if [ -z "$current" ]; then
            current=0
          fi
          next=$((current + 1))
          # Эти две строчки появятся в «Job summary» — их будет видно сразу
          echo "Current: $current" >> $GITHUB_STEP_SUMMARY
          echo "Next: $next" >> $GITHUB_STEP_SUMMARY
          
          echo "{\"views\":$next}" > stats.json
          echo "::set-output name=changed::true"

      - name: Commit and push only if changed
        if: steps.count.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add stats.json
          git commit -m "Update views to $next" || true
          git push
